[versions]
# Android Gradle Plugin
agp = "9.3.0-rc01"

# SDK levels
compileSdk = "37"
targetSdk = "36"
minSdk = "30"

# Kotlin
kotlin = "2.4.10"

# AndroidX
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"

# Test
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# Quality
detekt = "1.23.8"
ktlintGradle = "14.2.0"

# Coverage
jacoco = "0.8.12"

# Build-logic internal (for compileOnly deps in convention module)
androidTools = "32.3.1"

[libraries]
# ── AndroidX ──────────────────────────────────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ── Compose (BOM-managed) ──────────────────────────────────────────────────────
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# ── Test ───────────────────────────────────────────────────────────────────────
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# ── Quality ────────────────────────────────────────────────────────────────────
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

# ── Build-logic: Gradle plugin artifacts (compileOnly in convention module) ────
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlintGradle" }

[plugins]
# ── External plugins ───────────────────────────────────────────────────────────
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

# ── Convention plugins (from build-logic composite build) ──────────────────────
shakelamp-android-application = { id = "shakelamp.android.application", version = "unspecified" }
shakelamp-android-application-compose = { id = "shakelamp.android.application.compose", version = "unspecified" }
shakelamp-android-library = { id = "shakelamp.android.library", version = "unspecified" }
shakelamp-android-library-compose = { id = "shakelamp.android.library.compose", version = "unspecified" }
shakelamp-android-feature = { id = "shakelamp.android.feature", version = "unspecified" }
shakelamp-jvm-library = { id = "shakelamp.jvm.library", version = "unspecified" }
shakelamp-android-quality = { id = "shakelamp.android.quality", version = "unspecified" }
shakelamp-android-jacoco = { id = "shakelamp.android.jacoco", version = "unspecified" }
